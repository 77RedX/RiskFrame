# ============================================================
# RiskFrame Production Multi-Container Orchestration
# ============================================================
# Usage:
#   docker compose up --build
#   Access Frontend Terminal at: http://localhost:3000
#   Access Backend API at:        http://localhost:5000/api/health
# ============================================================

services:
  # 1. React 19 Frontend Terminal (Auto-built & served via NGINX)
  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: production
    container_name: riskframe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # 2. Node.js Express API & Agentic Engine
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: riskframe-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_URL=sqlite:///local_fallback.db
      - REDIS_URL=redis://redis:6379
      - PYTHON_QUANT_URL=http://quant-engine:5001
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - JWT_SECRET=riskframe_production_jwt_secret_key_2026
    depends_on:
      - mongo
      - redis
      - quant-engine
    restart: unless-stopped

  # 3. PyTorch Deep Learning & SLSQP Quant Sidecar
  quant-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: riskframe-quant-engine
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=MONGO_URI
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5000
    restart: unless-stopped

  # 4. Redis High-Speed Telemetry & Cache
  redis:
    image: redis:7-alpine
    container_name: riskframe-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # 5. MongoDB Document Persistence
  mongo:
    image: mongo:7-jammy
    container_name: riskframe-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  redis_data:
